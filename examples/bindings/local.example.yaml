# Copy to local.yaml and set the provider, model, and effort for your account.
# These are illustrative IDs, not proof of client compatibility or authentication.
# `targets` is optional: each listed agent gets the base route with its own
# fields applied, so one route can drive several agents with different models.
routes:
  openai:
    provider: openai
    transport: native
    authentication: oauth
    model: gpt-6-sol
    effort: high
    targets:
      claude-code:
        provider: anthropic
        model: claude-sonnet-5
      opencode:
        model: gpt-6-luna
    # `roles` is optional: names match ^[a-z][a-z0-9-]{0,62}$ except default.
    # Profile definitions generate subagent files (Codex, OpenCode, Claude Code,
    # Oh My Pi). Binding-only roles set Oh My Pi modelRoles without agent files.
    # Semantic slots: worker=task; planner=plan+slow; research=smol; tiny=commit+tiny.
    # Other names map directly (code=modelRoles.code, review=modelRoles.review).
    # Do not bind an alias and its direct slot together (e.g. worker + task).
    # A profile role without a binding uses the agent's default model.
    # `subagentMaxEffort` (Oh My Pi task.maxEffort) caps per-spawn effort.
    subagentMaxEffort: high
    roles:
      research:
        provider: openai
        model: gpt-6-luna
        effort: medium
      tiny:
        provider: openai
        model: gpt-6-luna
        effort: low
