# Copy to local.yaml and set the provider, model, and effort for your account.
# These are illustrative IDs, not proof of client compatibility or authentication.
# `targets` is optional: each listed agent gets the base route with its own
# fields applied, so one route can drive several agents with different models.
routes:
  openai:
    provider: openai
    transport: native
    authentication: oauth
    model: gpt-6-sol
    effort: high
    targets:
      claude-code:
        provider: anthropic
        model: claude-sonnet-5
      opencode:
        model: gpt-6-luna
    # `roles` is optional: extra named roles with their own model. Only Oh My Pi
    # installs them (as modelRoles.<role>: provider/model:effort); other agents
    # list them as not installed.
    # roles:
    #   smol:
    #     provider: opencode-go
    #     model: gpt-6-luna
    #     effort: high
    #   tiny:
    #     provider: opencode-go
    #     model: glm-5.3-flash
    #     effort: low
