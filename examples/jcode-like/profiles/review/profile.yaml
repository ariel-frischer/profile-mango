apiVersion: profilemango.dev/v1alpha1
kind: PolicyProfile
metadata:
  name: review
  description: Read-only review profile with no shell or mutation tools
  labels:
    example: jcode-like
spec:
  extends: base
  permissions:
    mode: read-only
    network: deny
    shell: deny
  tools:
    allow: [read, search]
    deny: [edit, write, shell, deploy]
  instructions:
    append:
      - instructions/review.md
