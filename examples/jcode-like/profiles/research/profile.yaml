apiVersion: profilemango.dev/v1alpha1
kind: PolicyProfile
metadata:
  name: research
  description: Read-only research profile with network and a dedicated skill
  labels:
    example: jcode-like
spec:
  extends: base
  permissions:
    mode: read-only
    network: allow
    shell: deny
  tools:
    allow: [read, search, web]
    deny: [edit, write, shell, deploy]
  instructions:
    append:
      - instructions/research.md
  skills:
    - skills/research/SKILL.md
