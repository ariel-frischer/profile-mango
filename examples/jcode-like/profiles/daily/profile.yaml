apiVersion: profilemango.dev/v1alpha1
kind: PolicyProfile
metadata:
  name: daily
  description: General coding profile with workspace writes and bounded shell access
  labels:
    example: jcode-like
spec:
  extends: base
  permissions:
    mode: workspace-write
    network: allow
    shell: allow
  tools:
    allow: [read, search, edit, write, shell, web]
    deny: [deploy]
  instructions:
    append:
      - instructions/daily.md
