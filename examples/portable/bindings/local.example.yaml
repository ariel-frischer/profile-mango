# Copy to local.yaml and choose models available to your own agent and account.
# These are illustrative IDs, not pinned-client compatibility or authentication proof.
routes:
  claude:
    provider: anthropic
    transport: native
    authentication: oauth
    model: claude-fable-5-1
    effort: high
  claude-daily:
    provider: anthropic
    transport: native
    authentication: oauth
    model: claude-sonnet-5
    effort: high
  openai:
    provider: openai
    transport: native
    authentication: oauth
    model: gpt-5.6-terra
    effort: high
  openai-focused:
    provider: openai
    transport: native
    authentication: oauth
    model: gpt-5.6-luna
    effort: high
  openai-hard:
    provider: openai
    transport: native
    authentication: oauth
    model: gpt-5.6-sol
    effort: high
