version: 2

project_name: profile-mango

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/mango/
    binary: mango
    ldflags:
      - -s -w
      - -X github.com/ariel-frischer/profile-mango/internal/version.Version={{.Version}}
      - -X github.com/ariel-frischer/profile-mango/internal/version.Commit={{.ShortCommit}}
      - -X github.com/ariel-frischer/profile-mango/internal/version.BuildDate={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  github:
    owner: ariel-frischer
    name: profile-mango
  mode: replace
